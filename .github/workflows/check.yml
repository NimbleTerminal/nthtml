name: check
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go test ./...
      - run: go vet ./...
      - run: GOOS=js GOARCH=wasm go build ./...
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: ./scripts/build-web.sh
      - run: |
          for demo in overview invoice field-notes status-report guide typography diagrams navigation reports positioning; do
            node scripts/wasm-smoke.cjs "$demo"
          done
      - run: GOOS=js GOARCH=wasm go test -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./document ./examples/demo ./internal/conformance
      - uses: actions/upload-artifact@v7
        with:
          name: browser-demo
          path: web/
      - run: CGO_ENABLED=0 go run ./cmd/nthtml-conformance
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance
          path: artifacts/conformance/
