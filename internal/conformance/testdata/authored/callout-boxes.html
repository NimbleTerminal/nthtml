<!doctype html>
<meta charset="utf-8">
<title>Nested callout box styling</title>
<style>
body { background: white; color: #172334; }
#callout {
  padding: 12px 18px 16px 20px;
  background: #e8f0f8;
  border-top: 3px solid #d02030;
  border-right: 5px solid #207040;
  border-bottom: 7px solid #3040c0;
  border-left: 9px solid #805020;
}
h2 { border-bottom: 4px solid #703090; }
p { border-left: 3px solid #c07010; }
pre { padding: 8px 10px; background: #ccddee; border: 2px solid #305070; }
/* explicit-zero-padding */
</style>
<section id="callout">
  <h2 id="heading">A useful callout</h2>
  <p id="paragraph">The paragraph keeps the callout background visible.</p>
  <pre id="code">go test ./...
go build ./...</pre>
</section>
